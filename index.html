<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kursposter-Generator</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg: #f4f6fa; --panel: #fff; --ink: #14233b; --muted: #5d6b80; --line: #dde3ec; --brand: #10478a; --brand-2: #2f6fb0; --danger: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1520; --panel: #172030; --ink: #e8eef7; --muted: #9aa8bc; --line: #2a374b; --brand: #7fb2ff; --brand-2: #9cc4ff; --danger: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 600 15px/1.45 Nunito, system-ui, sans-serif; }
  .lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .lock form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  .lock h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  .lock p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .lock label { display: block; font-size: 13px; color: var(--muted); }
  .lock input[type=password] { display: block; width: 100%; margin: 4px 0 12px; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .lock input[type=password]:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
  .lock .check { display: flex; gap: 8px; align-items: center; color: var(--ink); margin-bottom: 16px; }
  .lock button { width: 100%; padding: 10px; font: inherit; font-weight: 800; border-radius: 8px; border: 1px solid var(--brand); background: var(--brand); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .lock button { color: #0f1520; } }
  .lock button:disabled { opacity: .7; cursor: progress; }
  .lock .err { color: var(--danger); font-size: 13px; min-height: 1.4em; margin: 10px 0 0; }
</style>
</head>
<body>
<main class="lock" id="lock">
  <form id="f" autocomplete="on">
    <h1>Kursposter-Generator</h1>
    <p>Online-Kurs Evangelisation · Zugang nur für das Team</p>
    <input type="text" name="username" value="stpaul-poster" autocomplete="username" hidden>
    <label for="pw">Passwort</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> Auf diesem Gerät angemeldet bleiben</label>
    <button id="go" type="submit">Öffnen</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
(() => {
  const KEY = 'stpaul-poster-key';
  const enc = new TextEncoder();
  const $ = id => document.getElementById(id);
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = u8 => [...u8].map(x => x.toString(16).padStart(2, '0')).join('');
  let bin = null;

  async function getBin() {
    if (bin) return bin;
    const r = await fetch('app.bin', { cache: 'no-cache' });
    if (!r.ok) throw new Error('app.bin fehlt');
    const u8 = new Uint8Array(await r.arrayBuffer());
    if (new TextDecoder().decode(u8.subarray(0, 4)) !== 'SPP1') throw new Error('app.bin hat ein unbekanntes Format');
    bin = { iter: new DataView(u8.buffer).getUint32(4), salt: u8.slice(8, 24), iv: u8.slice(24, 36), ct: u8.subarray(36) };
    return bin;
  }
  async function deriveKey(pw, b) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b.salt, iterations: b.iter }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decrypt(key, b) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.iv }, key, b.ct); // wirft bei falschem Passwort
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  }
  async function start(bundle) {
    const urls = {};
    for (const [p, f] of Object.entries(bundle.files)) urls[p] = URL.createObjectURL(new Blob([unb64(f.b64)], { type: f.type }));
    window.POSTER_ASSET = p => urls[p] || p;
    for (const s of bundle.styles) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = urls[s]; document.head.appendChild(l); }
    document.body.innerHTML = bundle.html;
    const top = document.querySelector('.top');
    if (top) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ghost'; b.textContent = 'Sperren';
      b.title = 'Gespeicherte Anmeldung auf diesem Gerät löschen';
      b.addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); });
      const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;gap:8px;align-items:center';
      const all = top.querySelector('#btn-all'); top.appendChild(wrap); wrap.appendChild(b); if (all) wrap.appendChild(all);
    }
    for (const s of bundle.scripts) await loadScript(urls[s]);
  }

  // Gespeicherten Schlüssel probieren
  (async () => {
    let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }
    if (!saved) return;
    try {
      const b = await getBin();
      if (saved.salt !== hex(b.salt)) throw 0; // neu verschlüsselt → neu anmelden
      const key = await crypto.subtle.importKey('raw', unb64(saved.k), 'AES-GCM', false, ['decrypt']);
      await start(await decrypt(key, b));
    } catch (e) { try { localStorage.removeItem(KEY); } catch (er) { } }
  })();

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const go = $('go'), err = $('err'); go.disabled = true; go.textContent = 'Wird geöffnet …'; err.textContent = '';
    try {
      const b = await getBin();
      const key = await deriveKey($('pw').value, b);
      let bundle;
      try { bundle = await decrypt(key, b); } catch (e) { throw new Error('Das Passwort ist falsch.'); }
      if ($('remember').checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        try { localStorage.setItem(KEY, JSON.stringify({ salt: hex(b.salt), k: b64(raw) })); } catch (e) { }
      }
      await start(bundle);
    } catch (e) {
      err.textContent = e.message || 'Unbekannter Fehler'; go.disabled = false; go.textContent = 'Öffnen'; $('pw').select();
    }
  });
})();
</script>
</body>
</html>
